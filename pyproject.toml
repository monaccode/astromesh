[project]
name = "astromesh"
version = "0.36.0"
description = "Astromesh Agent Runtime Platform — multi-model, multi-pattern AI agent runtime"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0.0"]
postgres = ["asyncpg>=0.30.0"]
sqlite = ["aiosqlite>=0.20.0"]
chromadb = ["chromadb>=0.5.0"]
qdrant = ["qdrant-client>=1.11.0"]
faiss = ["faiss-cpu>=1.8.0"]
embeddings = ["sentence-transformers>=3.0.0"]
onnx = ["onnxruntime>=1.19.0"]
ml = ["torch>=2.0.0"]
observability = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
]
mcp = ["mcp>=1.0.0"]
mesh = ["psutil>=5.9.0"]
litellm = ["litellm>=1.50.0"]
# astromesh-nebula is a separate repo (not published); install it manually for local
# Centinela work: `uv pip install -e ../astromesh-nebula`. Kept out of the dependency
# graph so the universal lock/CI does not require the sibling checkout.
centinela = ["huggingface_hub>=0.24"]
all = [
    "astromesh[redis,postgres,sqlite,chromadb,qdrant,faiss,embeddings,onnx,observability,mcp,mesh,litellm,centinela]",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "respx>=0.21.0",
    # Sin techo a propósito: el ruleset que corre el gate está declarado en
    # `[tool.ruff.lint] select`, no heredado del default de ruff. Una versión
    # nueva ya no puede ampliar el gate sola (que fue lo que rompió CI con 0.16).
    "ruff>=0.16",
    "pytest-benchmark>=4.0",
    "asgi-lifespan>=2.1.0",
    "pytest-mock>=3.15.1",
    "pre-commit>=3.5.0",
    "jsonschema>=4.20",
    "astromesh-adk",
]

[tool.uv.sources]
astromesh-adk = { path = "astromesh-adk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astromesh"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "astromesh/_bundled/config"

[tool.hatch.build.targets.sdist]
include = [
    "astromesh/",
    "config/",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["benchmark: marks tests as benchmarks (deselect with '-m \"not benchmark\"')"]

[tool.ruff]
target-version = "py312"
line-length = 100

# El gate se declara acá, no se hereda del default de ruff. Antes este bloque no
# existía: ruff 0.16 amplió su ruleset por defecto y CI se puso rojo sin que
# cambiara una línea de código. Con `select` explícito, una versión nueva ya no
# puede ampliar el gate sola — para endurecerlo hay que editar esta lista.
[tool.ruff.lint]
select = [
    "F",                      # pyflakes
    "E4", "E7", "E9",         # pycodestyle: errores reales (E501 lo cubre el formateador)
    "W",                      # pycodestyle warnings
    "I",                      # orden de imports
    "UP",                     # pyupgrade (target py312)
    "B",                      # bugbear: clases de bug reales
    "C4",                     # comprehensions
    "SIM",                    # simplificaciones
    "RET",                    # returns
    "PERF", "FURB", "PIE", "FLY",
    "DTZ",                    # datetimes sin tz
    "ASYNC",                  # todo el runtime es async
    "LOG", "G",               # logging
    "PT",                     # estilo pytest
    "N",                      # naming
    "PTH",                    # pathlib
    "ISC",                    # concatenación implícita
    "RUF",
    "BLE",                    # except Exception sin acotar
    "PLE", "PLW",             # pylint: errores y warnings
    "S102", "S110", "S112",   # exec, except-pass, except-continue
    "TRY002", "TRY004",
]

# Dos reglas del set de arriba chocan con decisiones deliberadas del repo. Se
# apagan acá, con el motivo, en vez de repartir `noqa` que nadie sabría revisar.
ignore = [
    # Los módulos de rutas exponen `router` + `set_runtime(runtime)` y guardan el
    # runtime en un singleton de módulo: es la arquitectura que documenta
    # CLAUDE.md y la usan los 16 sitios que PLW0603 marca. Sacar el `global`
    # significa rediseñar el cableado de la API, no callar un linter.
    "PLW0603",
    # Renombrar `CredentialMissing` -> `CredentialMissingError` (y equivalentes)
    # toca 45 referencias, entre ellas la spec aprobada del marco de
    # integraciones. Es un cambio de nombres públicos: se decide aparte.
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Los tests difieren del código de librería por diseño: bloquear el loop no
# molesta a nadie, las fechas ingenuas alcanzan, y atrapar todo o dejar pasar
# una excepción suele ser el montaje del caso, no un descuido.
"tests/**" = ["ASYNC230", "ASYNC240", "DTZ001", "DTZ005", "BLE001", "S110", "SIM105", "TRY002", "RUF012"]


[tool.commitizen]
name = "cz_conventional_commits"
version = "0.36.0"
version_files = [
    "pyproject.toml:version",
    "astromesh/__init__.py:__version__",
]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_start_rev = "4545130"

[tool.maturin]
manifest-path = "native/Cargo.toml"
module-name = "astromesh._native"
python-source = "."
features = ["pyo3/extension-module"]
