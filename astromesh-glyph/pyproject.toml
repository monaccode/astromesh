[project]
name = "astromesh-glyph"
version = "0.1.0"
description = "Glyph — lenguaje de acción para agentes LLM: un programa en vez de N tool-calls"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
# Sin dependencias de runtime, a propósito: el núcleo tiene que poder vivir
# dentro de cualquier host, incluida la imagen mínima de astromesh-os.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    # Sin techo: el ruleset va declarado en [tool.ruff.lint] select, así que una
    # versión nueva no puede ampliar el gate sola.
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astromesh_glyph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "F", "E4", "E7", "E9", "W",
    "I", "UP", "B", "C4", "SIM", "RET",
    "PERF", "FURB", "PIE", "FLY",
    "DTZ", "ASYNC", "LOG", "G",
    "PT", "N", "PTH", "ISC", "RUF", "BLE",
    "PLE", "PLW",
    "S102", "S110", "S112",
    "TRY002", "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001", "S110", "SIM105", "TRY002", "RUF012"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
