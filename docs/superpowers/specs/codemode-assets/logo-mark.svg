<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/><stop offset="0.45" stop-color="#7cc4fa"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#f0f9ff" stop-opacity="0.2"/><stop offset="1" stop-color="#1d4ed8" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="stable" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#7cc4fa"/>
    </linearGradient>
    <linearGradient id="chunk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe4"/><stop offset="1" stop-color="#172f7a"/>
    </linearGradient>
    <linearGradient id="orbitA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e40af"/><stop offset="0.5" stop-color="#1fb4f2"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="orbitB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.34"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="200" r="178" fill="url(#glow)"/>

  <!-- orbit behind the editor -->
  <ellipse cx="200" cy="200" rx="184" ry="64" transform="rotate(30 200 200)" fill="none" stroke="url(#orbitB)" stroke-width="8"/>

  <!-- the program the model writes -->
  <rect x="98" y="98" width="204" height="204" rx="30" fill="#0a1638"/>
  <rect x="98" y="98" width="204" height="204" rx="30" fill="url(#glass)"/>

  <!-- prompt and cursor -->
  <path d="M126 126 l16 13 l-16 13" fill="none" stroke="#fde047" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="154" y="146" width="30" height="8" rx="4" fill="#fde047"/>

  <!-- code: the indented line in yellow is the call to a tool -->
  <rect x="124" y="174" width="120" height="18" rx="9" fill="url(#stable)"/>
  <rect x="150" y="204" width="96" height="18" rx="9" fill="#fde047"/>
  <rect x="150" y="234" width="72" height="16" rx="8" fill="url(#chunk)"/>
  <rect x="124" y="262" width="132" height="16" rx="8" fill="url(#chunk)"/>

  <rect x="98" y="98" width="204" height="204" rx="30" fill="none" stroke="url(#frame)" stroke-width="16"/>

  <!-- orbit in front of the editor -->
  <ellipse cx="200" cy="200" rx="188" ry="70" transform="rotate(-22 200 200)" fill="none" stroke="url(#orbitA)" stroke-width="8"/>

  <!-- the call leaves the sandbox and reaches a tool on the orbit -->
  <line x1="246" y1="213" x2="352" y2="94" stroke="#fde047" stroke-width="5" stroke-linecap="round"/>
  <circle cx="246" cy="213" r="9" fill="#ffffff"/>
  <circle cx="352" cy="94" r="16" fill="#fde047"/>

  <!-- other tools on the orbits -->
  <circle cx="70" cy="86" r="13" fill="#ffffff"/>
  <circle cx="36" cy="262" r="14" fill="#1fb4f2"/>
  <circle cx="330" cy="330" r="13" fill="#ffffff"/>
</svg>
