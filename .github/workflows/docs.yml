name: Deploy Docs

on:
  push:
    # `main`, no `develop`. El repo se mudó a main —ahí salen los releases y ahí
    # apunta origin/HEAD— y este workflow se quedó mirando la rama vieja: para
    # publicar había que back-mergear main→develop a mano, y cuando nadie se
    # acordó el sitio quedó 10 commits y tres releases atrás (0.48, 0.49, 0.50),
    # publicando desde el 2026-08-28 hasta el 2026-09-08 sin que nada avisara.
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
  # Para republicar sin tener que tocar un archivo de docs.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ensure GitHub Pages is configured for Actions-based deployments.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup npm
        run: npm install -g npm@11.6.0

      - name: Show Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
