name: Bench Glyph

on:
  schedule:
    # Nightly: la corrida gasta dinero real, así que no va en el gate de PR.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked --extra all
      - name: Run benchmark
        env:
          ASTROMESH_CONFIG_DIR: config
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m bench.glyph.run | tee bench-report.md
      - name: Publish report
        run: cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
